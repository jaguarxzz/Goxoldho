name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www && cp index.html www/index.html
          npx cap init "Wave Player" com.wave.player --web-dir=www
          npx cap add android
      - name: Patch MainActivity (WebView tetap hidup di background)
        run: |
          cat > android/app/src/main/java/com/wave/player/MainActivity.java <<'JAVA'
          package com.wave.player;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}
            }
            @Override public void onPause() { super.onPause(); keep(); }
            @Override public void onStop() { super.onStop(); keep(); }
            private void keep() {
              try { getBridge().getWebView().onResume(); getBridge().getWebView().resumeTimers(); } catch (Exception e) {}
            }
          }
          JAVA
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Wave Player v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
