name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www && cp index.html www/index.html
          sed -i 's#<meta name="viewport"[^>]*>#<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">#' www/index.html
          sed -i 's#</style>#html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{overscroll-behavior:none}</style>#' www/index.html
          npx cap init "Wave Player" com.wave.player --web-dir=www
          npx cap add android
      - name: Ikon aplikasi
        run: |
          if [ -f icon.png ]; then
            which convert || sudo apt-get install -y imagemagick
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read n s f <<< "$d"
              r=android/app/src/main/res/mipmap-$n
              convert icon.png -resize ${s}x${s} $r/ic_launcher.png
              convert icon.png -resize ${s}x${s} $r/ic_launcher_round.png
              convert icon.png -resize ${f}x${f} $r/ic_launcher_foreground.png
            done
          fi
      - name: Patch Android (service latar belakang)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/><application#' $M
          sed -i 's#</application>#<service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback"/></application>#' $M
          D=android/app/src/main/java/com/wave/player
          cat > $D/KeepAliveService.java <<'JAVA'
          package com.wave.player;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          public class KeepAliveService extends Service {
            private PowerManager.WakeLock wl;
            @Override public IBinder onBind(Intent i) { return null; }
            @Override public int onStartCommand(Intent i, int f, int id) {
              try {
                NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= 26) {
                  nm.createNotificationChannel(new NotificationChannel("wave", "Wave Player", NotificationManager.IMPORTANCE_LOW));
                }
                PendingIntent pi = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "wave") : new Notification.Builder(this);
                Notification n = b.setContentTitle("Wave Player").setContentText("Musik berjalan di latar belakang")
                  .setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(pi).setOngoing(true).build();
                if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                else startForeground(1, n);
                if (wl == null) {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "wave:play");
                  wl.acquire();
                }
              } catch (Exception e) {}
              return START_STICKY;
            }
            @Override public void onDestroy() {
              try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) {}
              super.onDestroy();
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.wave.player;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private final Handler h = new Handler(Looper.getMainLooper());
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              try {
                WebSettings s = getBridge().getWebView().getSettings();
                s.setMediaPlaybackRequiresUserGesture(false);
                s.setTextZoom(100);
                s.setSupportZoom(false);
                s.setBuiltInZoomControls(false);
              } catch (Exception e) {}
              try {
                if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                Intent s = new Intent(this, KeepAliveService.class);
                if (Build.VERSION.SDK_INT >= 26) startForegroundService(s); else startService(s);
              } catch (Exception e) {}
            }
            @Override public void onPause() { super.onPause(); keep(); }
            @Override public void onStop() { super.onStop(); keep(); }
            private void keep() {
              for (int d : new int[]{0, 300, 1000, 2500}) {
                h.postDelayed(() -> {
                  try {
                    WebView w = getBridge().getWebView();
                    w.onResume();
                    w.resumeTimers();
                    w.dispatchWindowVisibilityChanged(View.VISIBLE);
                  } catch (Exception e) {}
                }, d);
              }
            }
          }
          JAVA
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Wave Player v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
